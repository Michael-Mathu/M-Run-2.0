name: Mwendo CI

on: [push, pull_request]

jobs:
  flutter-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Install app dependencies
        run: cd app && flutter pub get
      - name: Analyze (must be zero-warning per CONTRIBUTING.md)
        run: cd app && flutter analyze
      - name: App tests
        run: cd app && flutter test

  go-test:
    runs-on: ubuntu-latest
    # Real Postgres/PostGIS + Redis so the DBStore/Redis-backed code paths
    # (geography casts, ST_Simplify, ZINCRBY sorted sets) are actually
    # exercised, not just the in-memory fallbacks -- see
    # internal/*/store_integration_test.go and
    # internal/leaderboard/leaderboard_integration_test.go.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: mwendo
          POSTGRES_PASSWORD: mwendo
          POSTGRES_DB: mwendo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mwendo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - name: Format check
        run: |
          cd backend
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi
      - name: Vet
        run: cd backend && go vet ./...
      - name: Backend tests (unit + Postgres/Redis integration)
        env:
          TEST_DATABASE_URL: postgres://mwendo:mwendo@localhost:5432/mwendo?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379/0
        run: cd backend && go test -race ./...

  rust-fit-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/mwendo_fit_parser/rust
      - name: Build
        run: cd packages/mwendo_fit_parser/rust && cargo build --locked
      - name: Clippy
        run: cd packages/mwendo_fit_parser/rust && cargo clippy --locked -- -D warnings

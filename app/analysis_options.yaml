# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # disallow_print: false  # Uncomment to disable the `avoid_print` rule
    # prefer_single_quotes: true  # Uncomment to enable the `prefer_single_quotes` rule

# Design system convention (enforced by code review):
#   - Screen/feature files MUST NOT contain hardcoded spacing, colors, radii, or shadows.
#   - All values live in lib/core/theme/app_theme.dart or lib/design_system/ components.
#   - Exception: one-off values that are genuinely unique to a single widget and
#     unlikely to be reused may be inlined, but must be reviewed.

# Lint rule: reject hardcoded spacing, colors, radii, shadows in screen/feature files.
# This rule will be added in Phase 1.
# The rule implementation will reject hardcoded values in files under:
#   lib/features/* (features)
#   lib/widgets (existing canonical components)
#   lib/design_system (new canonical components)

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options


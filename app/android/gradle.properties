# Optimized for memory-constrained Windows environments
# Fixes JVM crashes (G1 virtual space allocation failures, pid 31476, 12604, 23424)
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Dfile.encoding=UTF-8

# Reduce parallel build workers to lower memory pressure
org.gradle.workers.max=2

# Enable Gradle build cache to reduce memory usage
org.gradle.caching=true

# Disable daemon to avoid memory accumulation (optional, uncomment if issues persist)
# org.gradle.daemon=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
